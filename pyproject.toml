[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-api-harvester"
version = "0.1.0"
description = "High-performance async API data collector with concurrency controls and retries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
async-api-harvester = "async_api_harvester.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
