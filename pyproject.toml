[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-api-harvester"
version = "0.1.0"
description = "High-performance async API data collector with concurrency controls and retries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "rich>=13.0,<14.0",
  "PyQt5>=5.15.10,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.26,<1.0",
]

[project.scripts]
async-api-harvester = "async_api_harvester.cli:main"

[tool.pytest.ini_options]
pythonpath = [""]
testpaths = ["tests"]

[tool.setuptools]
packages = ["async_api_harvester", "gui_app"]
