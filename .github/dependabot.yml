version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "shayanghad0"
    assignees:
      - "shayanghad0"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

